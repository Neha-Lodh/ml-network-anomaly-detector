{% extends "base.html" %}
{% block title %}Register - ML Network Anomaly Detector{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Create account</h2>
    <p class="section-sub">New accounts get the <strong>analyst</strong> role.</p>
    <form method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus maxlength="30">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" maxlength="128">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" maxlength="128">
        <p class="hint">At least 8 characters, with a letter and a number.</p>
        <button type="submit" class="btn btn-block">Create account</button>
    </form>
    <p class="auth-alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
