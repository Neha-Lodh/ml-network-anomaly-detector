{% extends "base.html" %}
{% block title %}Log in - ML Network Anomaly Detector{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Log in</h2>
    <p class="section-sub">Sign in to access the dashboard.</p>
    <form method="POST" action="{{ url_for('login', next=next) if next else url_for('login') }}" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" maxlength="30">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="128">
        <button type="submit" class="btn btn-block">Log in</button>
    </form>
    {% if registration_open %}
    <p class="auth-alt">No account? <a href="{{ url_for('register') }}">Create one</a></p>
    {% endif %}
</div>
{% endblock %}
