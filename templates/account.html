{% extends "base.html" %}
{% block title %}Account - ML Network Anomaly Detector{% endblock %}
{% block content %}
<h2 style="margin-bottom:4px;">My Account</h2>
<p class="section-sub">Signed in as <strong>{{ current_user.username }}</strong> ({{ current_user.role }}).</p>

<div class="section auth-card" style="margin:0 0 26px 0;">
    <h2>Change password</h2>
    <form method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autocomplete="current-password" maxlength="128">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required autocomplete="new-password" maxlength="128">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" maxlength="128">
        <button type="submit" class="btn btn-block">Update password</button>
    </form>
</div>
{% endblock %}
